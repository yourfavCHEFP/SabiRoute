# SabiRoute CI: tests, lint, types, frontend syntax, container build.
#
# No provider credentials, no secrets, no deployments. Redis runs as a
# service so the environment-gated rate-limit tests execute here instead of
# skipping (local runs without SABIROUTE_TEST_REDIS_URL still skip them —
# the suite reports skips explicitly, never as passes).

name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SABIROUTE_TEST_REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (locked)
        run: uv sync --frozen

      - name: Run test suite
        run: uv run pytest -q

      - name: Ruff check
        run: uv run ruff check src tests scripts config

      - name: Mypy
        run: uv run mypy src

      - name: Build application container
        run: docker build -t sabiroute:ci .
