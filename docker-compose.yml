services:

  # ==========================================================
  # SABIROUTE / LITELLM GATEWAY
  # ==========================================================

  litellm:
    image: ghcr.io/berriai/litellm:main-latest

    container_name: sabiroute-gateway

    restart: unless-stopped

    ports:
      - "127.0.0.1:${LITELLM_PORT:-${SABIROUTE_PORT:-4000}}:4000"

    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"

    volumes:
      - ./config/config.yaml:/app/config.yaml:ro

    env_file:
      - .env

    environment:

      # ------------------------------------------------------
      # LiteLLM core
      # ------------------------------------------------------

      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}

      # ------------------------------------------------------
      # Database
      # ------------------------------------------------------

      DATABASE_URL: postgresql://${POSTGRES_USER:-sabiroute}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sabiroute}

      # ------------------------------------------------------
      # Redis
      # ------------------------------------------------------

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

      # ------------------------------------------------------
      # Provider credentials
      # ------------------------------------------------------

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}

      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}

      ZHIPUAI_API_KEY: ${ZHIPUAI_API_KEY:-}

      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}

      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}

      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}

      GROQ_API_KEY: ${GROQ_API_KEY:-}

    depends_on:

      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s


  # ==========================================================
  # POSTGRESQL
  # ==========================================================

  postgres:
    image: postgres:16-alpine

    container_name: sabiroute-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sabiroute}
      POSTGRES_USER: ${POSTGRES_USER:-sabiroute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - sabiroute_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sabiroute} -d ${POSTGRES_DB:-sabiroute}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  # ==========================================================
  # REDIS
  # ==========================================================

  redis:
    image: redis:7-alpine

    container_name: sabiroute-redis

    restart: unless-stopped

    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}"
      ]

    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

    volumes:
      - sabiroute_redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "--no-auth-warning",
          "-a",
          "${REDIS_PASSWORD}",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


# ============================================================
# PERSISTENT STORAGE
# ============================================================

volumes:

  sabiroute_postgres_data:
    name: sabiroute_postgres_data

  sabiroute_redis_data:
    name: sabiroute_redis_data
