="1420" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="450" fill="#A8B8D2" text-anchor="start">Tests are evidence, not a substitute for deployment measurements.</text><rect x="90" y="720" width="20" height="20" rx="5" fill="#06B6D4"/><text x="130" y="942" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="550" fill="#F8FAFC" text-anchor="start">Record what remains unknown</text><text x="80" y="1420" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="450" fill="#A8B8D2" text-anchor="start">Tests are evidence, not a substitute for deployment measurements.</text></svg>