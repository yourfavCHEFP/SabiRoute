<svg width="1400" height="620" viewBox="0 0 1400 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="48%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1400" height="620" rx="22" fill="url(#bg)"/>
  <rect width="1400" height="620" rx="22" fill="url(#halo)"/>
  <rect x="1" y="1" width="1398" height="618" rx="21" fill="none" stroke="#263244"/>

  <!-- Header -->
  <text x="56" y="54" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="13" font-weight="700" letter-spacing="3" fill="#94a3b8">
    SABIROUTE · CONTEXT-AWARE AI GATEWAY
  </text>
  <text x="56" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="58" font-weight="800" fill="url(#brand)">SabiRoute</text>
  <text x="59" y="145" font-family="Fira Code, Menlo, monospace"
        font-size="16" letter-spacing="1" fill="#94a3b8">
    ONE ENDPOINT · POLICY + ROUTING · LITELLM EXECUTION
  </text>

  <!-- Architecture labels -->
  <text x="56" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="13" font-weight="700" letter-spacing="2" fill="#64748b">CLIENTS</text>
  <text x="326" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="13" font-weight="700" letter-spacing="2" fill="#8b5cf6">SABIROUTE CONTROL PLANE</text>
  <text x="856" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="13" font-weight="700" letter-spacing="2" fill="#22d3ee">EXECUTION</text>
  <text x="1120" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="13" font-weight="700" letter-spacing="2" fill="#64748b">DATA</text>

  <!-- Client cards -->
  <g filter="url(#shadow)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="56" y="215" width="72" height="62" rx="11" fill="#111827" stroke="#334155"/>
    <rect x="138" y="215" width="72" height="62" rx="11" fill="#111827" stroke="#334155"/>
    <rect x="220" y="215" width="72" height="62" rx="11" fill="#111827" stroke="#334155"/>
    <rect x="56" y="287" width="236" height="42" rx="10" fill="#0f172a" stroke="#263244"/>
    <text x="92" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#e2e8f0">Chatbox</text>
    <text x="174" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#e2e8f0">VS Code</text>
    <text x="256" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#e2e8f0">Python</text>
    <text x="174" y="313" text-anchor="middle" font-size="12" fill="#94a3b8">CLI · agents · other OpenAI-compatible clients</text>
  </g>

  <!-- Connector -->
  <line x1="302" y1="270" x2="326" y2="270" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- SabiRoute control box -->
  <g filter="url(#shadow)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="326" y="210" width="488" height="175" rx="16" fill="#101827" stroke="#7c3aed" stroke-opacity="0.65"/>
    <rect x="326" y="210" width="488" height="6" rx="3" fill="url(#route)"/>

    <text x="350" y="244" font-size="20" font-weight="800" fill="#f8fafc">SabiRoute Routing &amp; Policy Layer</text>
    <text x="350" y="268" font-size="12" fill="#94a3b8">SabiRoute decides what should happen. LiteLLM executes it.</text>

    <g font-size="11" font-weight="700">
      <rect x="350" y="289" width="101" height="31" rx="8" fill="#172033" stroke="#334155"/>
      <rect x="459" y="289" width="101" height="31" rx="8" fill="#172033" stroke="#334155"/>
      <rect x="568" y="289" width="101" height="31" rx="8" fill="#172033" stroke="#334155"/>
      <rect x="677" y="289" width="113" height="31" rx="8" fill="#172033" stroke="#334155"/>
      <text x="400" y="309" text-anchor="middle" fill="#c4b5fd">Auth / Policy</text>
      <text x="509" y="309" text-anchor="middle" fill="#c4b5fd">Classify</text>
      <text x="618" y="309" text-anchor="middle" fill="#c4b5fd">Capabilities</text>
      <text x="733" y="309" text-anchor="middle" fill="#c4b5fd">Health Filter</text>

      <rect x="350" y="331" width="129" height="31" rx="8" fill="#172033" stroke="#334155"/>
      <rect x="487" y="331" width="129" height="31" rx="8" fill="#172033" stroke="#334155"/>
      <rect x="624" y="331" width="166" height="31" rx="8" fill="#172033" stroke="#334155"/>
      <text x="414" y="351" text-anchor="middle" fill="#c4b5fd">Route Engine</text>
      <text x="551" y="351" text-anchor="middle" fill="#c4b5fd">Fallback</text>
      <text x="707" y="351" text-anchor="middle" fill="#c4b5fd">Telemetry / Governance</text>
    </g>
  </g>

  <line x1="814" y1="297" x2="856" y2="297" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LiteLLM -->
  <g filter="url(#shadow)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="856" y="232" width="222" height="130" rx="16" fill="#0d1d25" stroke="#0891b2" stroke-opacity="0.75"/>
    <text x="967" y="273" text-anchor="middle" font-size="25" font-weight="800" fill="#ecfeff">LiteLLM</text>
    <text x="967" y="298" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1" fill="#67e8f9">EXECUTION ENGINE</text>
    <text x="967" y="325" text-anchor="middle" font-size="11" fill="#94a3b8">provider adapters · retries · streaming</text>
    <text x="967" y="345" text-anchor="middle" font-size="11" fill="#64748b">OpenAI-compatible downstream execution</text>
  </g>

  <line x1="1078" y1="297" x2="1112" y2="297" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Provider column -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="1112" y="210" width="232" height="175" rx="16" fill="#101827" stroke="#334155"/>
    <text x="1134" y="242" font-size="13" font-weight="800" fill="#e2e8f0">Independent providers</text>

    <g font-size="11" font-weight="700">
      <rect x="1134" y="256" width="90" height="30" rx="7" fill="#172033" stroke="#334155"/>
      <rect x="1234" y="256" width="90" height="30" rx="7" fill="#172033" stroke="#334155"/>
      <rect x="1134" y="294" width="90" height="30" rx="7" fill="#172033" stroke="#334155"/>
      <rect x="1234" y="294" width="90" height="30" rx="7" fill="#172033" stroke="#334155"/>
      <rect x="1134" y="332" width="90" height="30" rx="7" fill="#172033" stroke="#334155"/>
      <rect x="1234" y="332" width="90" height="30" rx="7" fill="#172033" stroke="#334155"/>
      <text x="1179" y="275" text-anchor="middle" fill="#cbd5e1">OpenAI</text>
      <text x="1279" y="275" text-anchor="middle" fill="#cbd5e1">Anthropic</text>
      <text x="1179" y="313" text-anchor="middle" fill="#cbd5e1">Gemini</text>
      <text x="1279" y="313" text-anchor="middle" fill="#cbd5e1">Qwen</text>
      <text x="1179" y="351" text-anchor="middle" fill="#cbd5e1">Kimi / GLM</text>
      <text x="1279" y="351" text-anchor="middle" fill="#cbd5e1">Groq / others</text>
    </g>
  </g>

  <!-- Observability / state -->
  <g filter="url(#shadow)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="326" y="425" width="1018" height="112" rx="16" fill="#0f172a" stroke="#334155"/>
    <text x="350" y="456" font-size="13" font-weight="800" letter-spacing="1.5" fill="#64748b">OBSERVABILITY · STATE · FUTURE ROUTING DATA</text>

    <rect x="350" y="474" width="190" height="42" rx="9" fill="#111827" stroke="#334155"/>
    <rect x="554" y="474" width="190" height="42" rx="9" fill="#111827" stroke="#334155"/>
    <rect x="758" y="474" width="190" height="42" rx="9" fill="#111827" stroke="#334155"/>
    <rect x="962" y="474" width="190" height="42" rx="9" fill="#111827" stroke="#334155"/>
    <rect x="1166" y="474" width="154" height="42" rx="9" fill="#111827" stroke="#334155"/>

    <text x="445" y="500" text-anchor="middle" font-size="12" font-weight="700" fill="#cbd5e1">PostgreSQL</text>
    <text x="649" y="500" text-anchor="middle" font-size="12" font-weight="700" fill="#cbd5e1">Redis</text>
    <text x="853" y="500" text-anchor="middle" font-size="12" font-weight="700" fill="#cbd5e1">Latency / Errors</text>
    <text x="1057" y="500" text-anchor="middle" font-size="12" font-weight="700" fill="#cbd5e1">Usage / Cost</text>
    <text x="1243" y="500" text-anchor="middle" font-size="12" font-weight="700" fill="#a5b4fc">ML later</text>
  </g>

  <!-- Future intelligence callout -->
  <rect x="56" y="425" width="236" height="112" rx="16" fill="#111827" stroke="#4f46e5" stroke-dasharray="6 6"/>
  <text x="78" y="456" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="12" font-weight="800" letter-spacing="1.5" fill="#818cf8">FUTURE INTELLIGENCE</text>
  <text x="78" y="483" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="16" font-weight="800" fill="#e0e7ff">Data-driven / ML routing</text>
  <text x="78" y="507" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="11" fill="#94a3b8">Learns from measured latency, cost,</text>
  <text x="78" y="523" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="11" fill="#94a3b8">reliability and request outcomes.</text>

  <!-- Footer -->
  <text x="56" y="585" font-family="Fira Code, Menlo, monospace"
        font-size="11" fill="#64748b">
    SABIROUTE  ·  SabiRoute owns policy &amp; routing  ·  LiteLLM owns provider execution  ·  deterministic first, ML later
  </text>
</svg>
