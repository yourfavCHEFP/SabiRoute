<svg width="1200" height="480" viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="480" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="480" rx="18" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="479" rx="18" fill="none" stroke="#30363d"/>

  <text x="60" y="60" font-size="13" letter-spacing="3" fill="#8b949e">SABIROUTE &#8212; SELF-HOSTED AI GATEWAY</text>

  <text x="58" y="150" font-size="72" font-weight="800" fill="url(#titleGrad)">SabiRoute</text>

  <text x="62" y="182" font-size="16" font-family="'Fira Code', monospace" fill="#8b949e" letter-spacing="1">ONE ENDPOINT &#183; EVERY PROVIDER &#183; SELF-HOSTED</text>

  <text x="60" y="228" font-size="30" font-weight="700" fill="#e6edf3">Never lose a request to a dead provider.</text>
  <text x="60" y="258" font-size="17" fill="#c9d1d9">Chatbox &#183; VS Code &#183; Python &#183; Mobile &#8594; <tspan fill="#22d3ee" font-weight="700">one gateway</tspan> &#8594; OpenAI &#183; Anthropic &#183; Gemini &#183; Qwen &#183; Kimi &#183; GLM &#183; MiniMax</text>

  <line x1="60" y1="285" x2="1140" y2="285" stroke="#30363d" stroke-width="1"/>

  <!-- stat cards -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- card 1 -->
    <rect x="60" y="315" width="150" height="100" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="135" y="365" font-size="30" font-weight="800" fill="#a855f7" text-anchor="middle">7</text>
    <text x="135" y="392" font-size="11" letter-spacing="1" fill="#8b949e" text-anchor="middle">PROVIDERS WIRED</text>

    <!-- card 2 -->
    <rect x="234" y="315" width="150" height="100" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="309" y="365" font-size="30" font-weight="800" fill="#22c55e" text-anchor="middle">6</text>
    <text x="309" y="392" font-size="11" letter-spacing="1" fill="#8b949e" text-anchor="middle">VIRTUAL STACKS</text>

    <!-- card 3 -->
    <rect x="408" y="315" width="150" height="100" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="483" y="365" font-size="30" font-weight="800" fill="#f59e0b" text-anchor="middle">24</text>
    <text x="483" y="392" font-size="11" letter-spacing="1" fill="#8b949e" text-anchor="middle">PHASE ROADMAP</text>

    <!-- card 4 -->
    <rect x="582" y="315" width="150" height="100" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="657" y="365" font-size="30" font-weight="800" fill="#38bdf8" text-anchor="middle">1</text>
    <text x="657" y="392" font-size="11" letter-spacing="1" fill="#8b949e" text-anchor="middle">API ENDPOINT</text>

    <!-- card 5 -->
    <rect x="756" y="315" width="150" height="100" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="831" y="365" font-size="30" font-weight="800" fill="#facc15" text-anchor="middle">$0</text>
    <text x="831" y="392" font-size="11" letter-spacing="1" fill="#8b949e" text-anchor="middle">TO SELF-HOST</text>

    <!-- card 6 -->
    <rect x="930" y="315" width="150" height="100" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="1005" y="365" font-size="26" font-weight="800" fill="#ec4899" text-anchor="middle">v0.1</text>
    <text x="1005" y="392" font-size="11" letter-spacing="1" fill="#8b949e" text-anchor="middle">CURRENT MILESTONE</text>
  </g>

  <text x="60" y="450" font-size="12" fill="#6e7681">github.com/yourfavCHEFP/SabiRoute &#183; built on LiteLLM &#183; Apache-2.0</text>
</svg>
