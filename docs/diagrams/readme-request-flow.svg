<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="510" viewBox="0 0 1400 510" role="img" aria-labelledby="title desc">
  <title id="title">SabiRoute request flow</title>
  <desc id="desc">A client request passes through access checks, candidate eligibility, route selection, LiteLLM execution, and outcome telemetry. Retryable failures return to bounded route selection.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#121b2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#7890aa"/>
    </marker>
    <marker id="retry-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#fbbf24"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#000" flood-opacity=".24"/>
    </filter>
  </defs>
  <rect width="1400" height="510" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1398" height="508" rx="23" fill="none" stroke="#26354a"/>
  <text x="64" y="58" fill="#a5b4fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2.5">INSIDE A SABIROUTE REQUEST</text>
  <text x="64" y="100" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="750">Policy decides. LiteLLM executes. Evidence is recorded.</text>
  <rect x="64" y="122" width="1272" height="4" rx="2" fill="url(#accent)" opacity=".9"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <g>
      <rect x="64" y="162" width="176" height="208" rx="16" fill="#111c2d" stroke="#52647c"/>
      <circle cx="90" cy="190" r="14" fill="#26364b"/><text x="90" y="195" text-anchor="middle" fill="#dbeafe" font-size="12" font-weight="700">01</text>
      <text x="82" y="238" fill="#f8fafc" font-size="17" font-weight="700">Client</text>
      <text x="82" y="265" fill="#b5c3d5" font-size="12">OpenAI-compatible</text>
      <text x="82" y="284" fill="#b5c3d5" font-size="12">request + route name</text>
      <path d="M84 321h70m-70 10h48" stroke="#60758e" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g>
      <rect x="274" y="162" width="176" height="208" rx="16" fill="#17182d" stroke="#7c69b2"/>
      <circle cx="300" cy="190" r="14" fill="#352d53"/><text x="300" y="195" text-anchor="middle" fill="#e9ddff" font-size="12" font-weight="700">02</text>
      <text x="292" y="238" fill="#f8fafc" font-size="17" font-weight="700">Access checks</text>
      <text x="292" y="265" fill="#c9bfdf" font-size="12">Authentication</text>
      <text x="292" y="284" fill="#c9bfdf" font-size="12">Rate + budget admission</text>
      <rect x="292" y="318" width="132" height="28" rx="8" fill="#292542"/><text x="358" y="337" text-anchor="middle" fill="#d8ccf4" font-size="11" font-weight="700">ALLOW OR REJECT</text>
    </g>
    <g>
      <rect x="484" y="162" width="176" height="208" rx="16" fill="#17202d" stroke="#3c8190"/>
      <circle cx="510" cy="190" r="14" fill="#173b49"/><text x="510" y="195" text-anchor="middle" fill="#cffafe" font-size="12" font-weight="700">03</text>
      <text x="502" y="238" fill="#f8fafc" font-size="17" font-weight="700">Eligibility</text>
      <text x="502" y="265" fill="#b8d5dc" font-size="12">Route policy</text>
      <text x="502" y="284" fill="#b8d5dc" font-size="12">Capabilities + health</text>
      <circle cx="506" cy="326" r="5" fill="#34d399"/><text x="519" y="330" fill="#b8d5dc" font-size="11">Eligible candidates only</text>
    </g>
    <g>
      <rect x="694" y="162" width="176" height="208" rx="16" fill="#192132" stroke="#8b7a4e"/>
      <circle cx="720" cy="190" r="14" fill="#443a24"/><text x="720" y="195" text-anchor="middle" fill="#fef3c7" font-size="12" font-weight="700">04</text>
      <text x="712" y="238" fill="#f8fafc" font-size="17" font-weight="700">Route choice</text>
      <text x="712" y="265" fill="#d6cba9" font-size="12">Configured priority</text>
      <text x="712" y="284" fill="#d6cba9" font-size="12">or measured score</text>
      <text x="712" y="334" fill="#fbbf24" font-size="11" font-weight="700">DETERMINISTIC BASELINE</text>
    </g>
    <g>
      <rect x="904" y="162" width="176" height="208" rx="16" fill="#102431" stroke="#32839b"/>
      <circle cx="930" cy="190" r="14" fill="#164253"/><text x="930" y="195" text-anchor="middle" fill="#cffafe" font-size="12" font-weight="700">05</text>
      <text x="922" y="238" fill="#f8fafc" font-size="17" font-weight="700">Execution</text>
      <text x="922" y="265" fill="#b7d8e1" font-size="12">LiteLLM handles</text>
      <text x="922" y="284" fill="#b7d8e1" font-size="12">provider execution</text>
      <path d="M924 326h116" stroke="#2c8299" stroke-width="3" stroke-linecap="round"/>
      <circle cx="1045" cy="326" r="5" fill="#38bdf8"/>
    </g>
    <g>
      <rect x="1114" y="162" width="176" height="208" rx="16" fill="#102a27" stroke="#3e8a68"/>
      <circle cx="1140" cy="190" r="14" fill="#194735"/><text x="1140" y="195" text-anchor="middle" fill="#d1fae5" font-size="12" font-weight="700">06</text>
      <text x="1132" y="238" fill="#f8fafc" font-size="17" font-weight="700">Observation</text>
      <text x="1132" y="265" fill="#b9dccb" font-size="12">Attempt outcome</text>
      <text x="1132" y="284" fill="#b9dccb" font-size="12">Usage + telemetry</text>
      <path d="M1134 326h62m8 0h28" stroke="#397c5d" stroke-width="3" stroke-linecap="round"/>
      <circle cx="1203" cy="326" r="5" fill="#34d399"/>
    </g>
  </g>

  <g stroke="#7890aa" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M242 266h25"/><path d="M452 266h25"/><path d="M662 266h25"/><path d="M872 266h25"/><path d="M1082 266h25"/>
  </g>
  <path d="M992 377v48H782v-48" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#retry-arrow)"/>
  <rect x="817" y="410" width="140" height="28" rx="8" fill="#332b1c"/>
  <text x="887" y="429" text-anchor="middle" fill="#fcd779" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">RETRYABLE ONLY</text>
  <text x="64" y="473" fill="#8ea0b5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Eligibility remains in force on every bounded fallback attempt. ML-assisted selection is not part of the current request path.</text>
</svg>
