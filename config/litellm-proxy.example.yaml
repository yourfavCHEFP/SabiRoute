general_settings:
  # Master key for the LiteLLM proxy — must be set via env var
  # Do not set a value here; the proxy reads LITELLM_MASTER_KEY from the environment
  cache_dir: ~/.litellm
  timeout: 120
  num_retries: 2

# Proxy server configuration
# Start with: litellm --config config/litellm-proxy.example.yaml --port 4000
# The SABIROUTE_LITELLM_URL environment variable overrides the default http://127.0.0.1:4000
# If SABIROUTE_LITELLM_URL is unset or empty, the gateway uses the default proxy URL

# Health check endpoint: GET http://127.0.0.1:4000/health
# Requires Authorization header: Bearer <LITELLM_MASTER_KEY>
# SabiRoute gateway uses the LITELLM_MASTER_KEY for authenticated calls.

# Environment variables (names only, never commit actual values):
#   LITELLM_MASTER_KEY    - Master key for the LiteLLM proxy (required)
#   OPENAI_API_KEY        - OpenAI API key (referenced by sabiroute-openai)
#   GEMINI_API_KEY        - Google Gemini API key (referenced by sabiroute-gemini)
#   GROQ_API_KEY          - Groq API key (referenced by sabiroute-groq)
#   TOGETHERAI_API_KEY    - Together AI API key (referenced by sabiroute-together)
#   DEEPINFRA_API_KEY     - DeepInfra API key (referenced by sabiroute-deepinfra)
#   MOONSHOT_API_KEY      - Moonshot API key (referenced by sabiroute-kimi)
#   COHERE_API_KEY        - Cohere API key (referenced by sabiroute-cohere)
#   ANTHROPIC_API_KEY     - Anthropic API key (referenced by sabiroute-claude)