# ==========================================================
# SabiRoute — LiteLLM Proxy Configuration (example template)
# NOT FOR COMMIT WITH SECRETS — env var references only
# ==========================================================
#
# This file is a template. It contains NO secret values.
# All credentials reference environment variables.
# Duplicate/adjust model entries to match your deployed aliases.
#
# Start the proxy with:
#   litellm --config config/litellm-proxy.example.yaml --port 4000
#
# The SabiRoute gateway defaults to http://127.0.0.1:4000
# and requires LITELLM_MASTER_KEY set in the environment.

model_list:

  # ==========================================================
  # 01 — OPENAI
  # ==========================================================

  - model_name: sabiroute-openai
    litellm_params:
      model: openai/gpt-6-luna
      api_key: os.environ/OPENAI_API_KEY
      num_retries: 1
    capabilities:
      chat: unknown
      coding: unknown
      reasoning: unknown
      vision: unknown
      long_context: unknown
      tool_use: unknown
      structured_output: unknown
      json: unknown
      streaming: unknown
      low_latency: unknown
      embedding: unknown
      multimodal: unknown

