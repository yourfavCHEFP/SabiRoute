# Drill-only LiteLLM proxy config. Fake credentials only. Never production.
model_list:
  - model_name: sabi-drill-model
    litellm_params:
      model: openai/sabi-stub-model
      api_base: http://sabi-stub:8399/v1
      api_key: sk-drill-fake

general_settings:
  master_key: sabi-drill-test-only

litellm_settings:
  # Drill-only shortened timeout (repo default is 120). Documented deviation.
  request_timeout: 10
  drop_params: true
  set_verbose: false
